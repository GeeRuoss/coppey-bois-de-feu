name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Préparer les chemins GitHub Pages
        run: python3 scripts/build-pages.py
      - name: Vérifier le JavaScript
        run: node --check build/github-pages/site.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/github-pages
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
